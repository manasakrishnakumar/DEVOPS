name: ci
on:
  push: {branches: [main]}
  pull_request:
jobs:
  test-build-scan-sign:
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write, id-token: write}
    env:
      REGISTRY: ghcr.io/${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.10"}
      - name: Unit tests (semantic guard)
        run: |
          pip install numpy pandas pytest cryptography==42.0.8
          pytest -q inference-api/tests
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - name: Build and push inference image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: inference-api
          push: true
          tags: ${{ env.REGISTRY }}/climate-inference:${{ github.sha }}
      - name: Trivy scan (fail on critical)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ env.REGISTRY }}/climate-inference:${{ github.sha }}
          severity: CRITICAL
          exit-code: "1"
      - uses: sigstore/cosign-installer@v3
      - name: Sign image (keyless)
        run: cosign sign --yes ${{ env.REGISTRY }}/climate-inference@${{ steps.build.outputs.digest }}
