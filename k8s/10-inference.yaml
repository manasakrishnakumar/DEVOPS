apiVersion: apps/v1
kind: Deployment
metadata: {name: inference-api, namespace: climate}
spec:
  replicas: 1
  selector: {matchLabels: {app: inference-api}}
  template:
    metadata:
      labels: {app: inference-api}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5001"
        prometheus.io/path: /metrics
    spec:
      containers:
      - name: inference-api
        image: climate-inference:2
        imagePullPolicy: Never
        ports: [{containerPort: 5001}]
        envFrom: [{configMapRef: {name: climate-config}}]
        startupProbe:
          httpGet: {path: /health/live, port: 5001}
          periodSeconds: 5
          failureThreshold: 30
        livenessProbe:
          httpGet: {path: /health/live, port: 5001}
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet: {path: /health/ready, port: 5001}
          periodSeconds: 5
          failureThreshold: 3
        resources: {requests: {memory: 1Gi, cpu: 250m}, limits: {memory: 2500Mi, cpu: "2"}}
---
apiVersion: v1
kind: Service
metadata: {name: inference-api, namespace: climate}
spec:
  selector: {app: inference-api}
  ports: [{port: 5001, targetPort: 5001}]
