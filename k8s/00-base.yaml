apiVersion: v1
kind: Namespace
metadata: {name: climate}
---
apiVersion: v1
kind: Secret
metadata: {name: climate-secrets, namespace: climate}
stringData:
  SECRET_KEY: "k8s-shared-secret-key-change-me"
  POSTGRES_PASSWORD: "climate_pw"
  DATABASE_URL: "postgresql://climate:climate_pw@postgres:5432/climate"
---
apiVersion: v1
kind: ConfigMap
metadata: {name: climate-config, namespace: climate}
data:
  INFERENCE_URL: "http://inference-api:5001"
  SAVE_PLOT_FILES: "0"
  MODELS: "sarima,lstm"
  FAULT_INJECTION: "1"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: pg-data, namespace: climate}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 1Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: postgres, namespace: climate}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        env:
        - {name: POSTGRES_USER, value: climate}
        - {name: POSTGRES_DB, value: climate}
        - name: POSTGRES_PASSWORD
          valueFrom: {secretKeyRef: {name: climate-secrets, key: POSTGRES_PASSWORD}}
        - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
        ports: [{containerPort: 5432}]
        volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
        readinessProbe:
          exec: {command: ["pg_isready", "-U", "climate"]}
          periodSeconds: 5
        resources: {requests: {memory: 128Mi, cpu: 100m}, limits: {memory: 512Mi}}
      volumes:
      - name: data
        persistentVolumeClaim: {claimName: pg-data}
---
apiVersion: v1
kind: Service
metadata: {name: postgres, namespace: climate}
spec:
  selector: {app: postgres}
  ports: [{port: 5432, targetPort: 5432}]


