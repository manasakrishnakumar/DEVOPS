apiVersion: apps/v1
kind: Deployment
metadata: {name: frontend, namespace: climate}
spec:
  replicas: 1
  selector: {matchLabels: {app: frontend}}
  template:
    metadata:
      labels: {app: frontend}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5000"
        prometheus.io/path: /metrics
    spec:
      initContainers:
      - name: wait-for-postgres
        image: postgres:15-alpine
        command: ['sh','-c','until pg_isready -h postgres -U climate; do sleep 2; done']
      containers:
      - name: frontend
        image: climate-frontend:2
        imagePullPolicy: Never
        ports: [{containerPort: 5000}]
        envFrom:
        - configMapRef: {name: climate-config}
        - secretRef: {name: climate-secrets}
        livenessProbe:
          httpGet: {path: /healthz, port: 5000}
          periodSeconds: 10
        readinessProbe:
          httpGet: {path: /healthz, port: 5000}
          periodSeconds: 5
        resources: {requests: {memory: 256Mi, cpu: 100m}, limits: {memory: 1Gi, cpu: "1"}}
---
apiVersion: v1
kind: Service
metadata: {name: frontend, namespace: climate}
spec:
  type: NodePort
  selector: {app: frontend}
  ports: [{port: 5000, targetPort: 5000, nodePort: 30500}]

