# Argo Rollouts canary with a model-quality gate. Replaces the inference Deployment when Argo Rollouts is installed.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata: {name: model-quality-gate, namespace: climate}
spec:
  args: [{name: max-reject-ratio, value: "0.05"}]
  metrics:
  - name: shadow-reject-ratio
    interval: 30s
    count: 6
    failureLimit: 1
    successCondition: result[0] <= {{args.max-reject-ratio}}
    provider:
      prometheus:
        address: http://prom-prometheus-server.monitoring.svc
        query: |
          sum(increase(shadow_reject_total[2m])) / clamp_min(sum(increase(shadow_total_total[2m])), 1)
  - name: p95-latency
    interval: 30s
    count: 6
    failureLimit: 2
    successCondition: result[0] <= 5
    provider:
      prometheus:
        address: http://prom-prometheus-server.monitoring.svc
        query: |
          histogram_quantile(0.95, sum by (le)(rate(predict_seconds_bucket[2m])))
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata: {name: inference-api, namespace: climate}
spec:
  replicas: 2
  selector: {matchLabels: {app: inference-api}}
  strategy:
    canary:
      steps:
      - setWeight: 25
      - analysis: {templates: [{templateName: model-quality-gate}]}
      - setWeight: 100
  template:
    metadata:
      labels: {app: inference-api}
      annotations: {prometheus.io/scrape: "true", prometheus.io/port: "5001", prometheus.io/path: /metrics}
    spec:
      containers:
      - name: inference-api
        image: climate-inference:3
        imagePullPolicy: Never
        env:
        - {name: SEMANTIC_GUARD, value: "1"}
        - {name: SHADOW_LSTM_DIR, value: /app/saved_models/lstm_candidate}
        ports: [{containerPort: 5001}]
        readinessProbe: {httpGet: {path: /health/semantic, port: 5001}, periodSeconds: 5}
        livenessProbe: {httpGet: {path: /health/live, port: 5001}, periodSeconds: 10}
